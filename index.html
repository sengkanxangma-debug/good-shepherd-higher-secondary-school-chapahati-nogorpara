<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Good Shepherd Higher Secondary School</title>
    <!-- School Logo as Favicon -->
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* --- GLOBAL FULL-PAGE ANIMATED BACKGROUND (TOP TO BOTTOM) --- */
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: transparent !important;
            position: relative;
            overflow-x: hidden;
        }

        .global-animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: linear-gradient(-45deg, #071126, #102a4c, #12476b, #0f3d3e, #1a1c3b, #2b102f);
            background-size: 400% 400%;
            animation: fullPageGradientShift 16s ease infinite;
            overflow: hidden;
            pointer-events: none;
        }

        @keyframes fullPageGradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Animated Ambient Glow Orbs across the Whole Page */
        .global-bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(65px);
            opacity: 0.35;
            pointer-events: none;
            animation: globalFloatOrb 12s infinite ease-in-out alternate;
        }
        .global-bg-orb.orb-1 {
            width: 380px;
            height: 380px;
            background: #00e5ff;
            top: 5%;
            left: -80px;
            animation-duration: 11s;
        }
        .global-bg-orb.orb-2 {
            width: 420px;
            height: 420px;
            background: #c90f3b;
            top: 35%;
            right: -100px;
            animation-duration: 14s;
            animation-delay: 2s;
        }
        .global-bg-orb.orb-3 {
            width: 340px;
            height: 340px;
            background: #48bb78;
            bottom: 5%;
            left: 15%;
            animation-duration: 13s;
            animation-delay: 4s;
        }
        .global-bg-orb.orb-4 {
            width: 290px;
            height: 290px;
            background: #ecc94b;
            top: 70%;
            right: 20%;
            opacity: 0.22;
            animation-duration: 15s;
            animation-delay: 1s;
        }
        .global-bg-orb.orb-5 {
            width: 320px;
            height: 320px;
            background: #3182ce;
            top: 15%;
            left: 45%;
            opacity: 0.28;
            animation-duration: 10s;
            animation-delay: 3s;
        }

        @keyframes globalFloatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(35px, -40px) scale(1.12); }
            100% { transform: translate(-25px, 35px) scale(0.95); }
        }

        /* Subtle Animated Mesh Grid Overlay for Depth */
        .global-animated-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                radial-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            animation: gridDrift 25s linear infinite;
            pointer-events: none;
        }
        @keyframes gridDrift {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        /* Make intermediate section wrappers transparent so the animated background flows top-to-bottom */
        .main-section,
        .main-section.gray-bg,
        .feature-showcase-section,
        .principal-section,
        .portal-animated-section {
            background: transparent !important;
        }

        /* --- NAVIGATION DROPDOWN SUB-MENU (ABOUT US -> FACULTY, CONTACT) --- */
        .nav-dropdown {
            position: relative;
            display: inline-block;
        }
        .nav-dropdown-toggle {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .dropdown-arrow {
            font-size: 0.75em;
            transition: transform 0.25s ease;
            display: inline-block;
        }
        .nav-dropdown:hover .dropdown-arrow,
        .nav-dropdown.open .dropdown-arrow {
            transform: rotate(180deg);
        }
        .nav-dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 175px;
            background: #102a4c;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 8px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            padding: 6px 0;
            z-index: 1000;
            overflow: hidden;
        }
        .nav-dropdown:hover .nav-dropdown-menu,
        .nav-dropdown.open .nav-dropdown-menu {
            display: block;
            animation: dropdownFadeIn 0.2s ease;
        }
        @keyframes dropdownFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #nav-menu .nav-dropdown-menu a {
            display: block !important;
            padding: 10px 18px !important;
            margin: 0 !important;
            color: #ffffff !important;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.2s ease, color 0.2s ease, padding-left 0.2s ease;
            white-space: nowrap;
        }
        #nav-menu .nav-dropdown-menu a:last-child {
            border-bottom: none;
        }
        #nav-menu .nav-dropdown-menu a:hover {
            background: #c90f3b !important;
            color: #ffffff !important;
            padding-left: 23px !important;
        }

        @media (max-width: 992px) {
            .nav-dropdown {
                width: 100%;
                display: block;
            }
            .nav-dropdown-menu {
                position: static;
                width: 100%;
                box-shadow: none;
                border: none;
                border-radius: 0;
                background: rgba(0, 0, 0, 0.2);
                padding: 0;
            }
            #nav-menu .nav-dropdown-menu a {
                padding-left: 32px !important;
            }
        }

        /* --- AUTO-SLIDING HERO SLIDESHOW (AUTO-ARRANGED TO PHOTO SIZES) --- */
        .slider-container {
            position: relative;
            width: 100%;
            height: 350px;
            margin-top: 0;
            overflow: hidden;
            background-color: #071126;
        }

        .slides-wrapper {
            display: flex;
            width: 400%;
            height: 100%;
            animation: heroSlideshow 20s infinite ease-in-out;
        }

        .slide-frame {
            width: 25%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0a1931;
        }

        .slide-bg-fill {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-size: cover;
            background-position: center;
            filter: blur(18px) brightness(0.55);
            z-index: 1;
        }

        .slide-img {
            position: relative;
            z-index: 2;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: 100%;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
        }

        @keyframes heroSlideshow {
            0%, 20% { transform: translateX(0%); }
            25%, 45% { transform: translateX(-25%); }
            50%, 70% { transform: translateX(-50%); }
            75%, 95% { transform: translateX(-75%); }
            100% { transform: translateX(0%); }
        }

        .slider-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(7, 17, 38, 0.25) 0%,
                rgba(7, 17, 38, 0.4) 65%,
                rgba(13, 27, 62, 0.85) 100%
            );
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            padding: 20px 20px 55px 20px;
            box-sizing: border-box;
            z-index: 3;
            pointer-events: none;
        }

        /* Blurred Lower Part of the Slideshow */
        .slider-bottom-blur {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(10, 25, 49, 0.78) 100%);
            z-index: 4;
            pointer-events: none;
        }

        .animate-school-name {
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.85);
            animation: textFadeTracking 2.5s ease-out infinite alternate;
        }
        @keyframes textFadeTracking {
            0% {
                letter-spacing: 1px;
                opacity: 0.88;
                transform: scale(0.98);
            }
            100% {
                letter-spacing: 4px;
                opacity: 1;
                transform: scale(1.02);
            }
        }

        /* --- 3-Column Feature Grid (Same Desktop Look & Feel Across All Devices) --- */
        .feature-showcase-section {
            position: relative;
            z-index: 5;
            margin-top: -35px;
            padding-bottom: 35px;
        }
        .db-three-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        .db-column {
            display: flex;
            flex-direction: column;
            background: transparent;
            border-right: 1px solid #e2e8f0;
        }
        .db-column:last-child {
            border-right: none;
        }

        /* Column Top Headers */
        .db-col-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px 24px;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 700;
        }
        .db-col-header.crimson-1 {
            background-color: #c90f3b;
        }
        .db-col-header.crimson-2 {
            background-color: #a80c30;
        }
        .db-col-header.crimson-3 {
            background-color: #6d071f;
        }
        .db-header-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border:
